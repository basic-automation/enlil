[package]
name = "enlil-platform"
version = "0.1.0"
edition = "2024"
description = "Enlil platform abstraction layer — threading, alloc, sync, async runtime, I/O"
license.workspace = true
repository.workspace = true
authors.workspace = true
# Publishing guard. This repo runs an automated nightly routine that reshapes
# these crates; they are tightly-coupled internals of an unfinished hypervisor,
# not yet standalone libraries. Flip to `true` (or delete) per crate only when
# its API is stable enough to maintain on crates.io under semver.
publish = false

[features]
default = ["platform-linux"]
platform-linux = []
# The bare-metal backend backs GlobalAlloc with the audited linked_list_allocator
# heap rather than the Linux system allocator.
platform-baremetal = ["dep:linked_list_allocator"]

[dependencies]
log = "0.4"
spin = "0.9"
# Intrusive-free-list heap for the bare-metal GlobalAlloc. Pulled in only under
# the platform-baremetal feature (no_std, no external OS deps).
linked_list_allocator = { version = "0.10", optional = true }

# The Linux epoll I/O reactor source (async_rt::epoll) needs raw epoll
# syscalls; gated to the Linux dev host so the bare-metal target never pulls it.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
env_logger = "0.11"
