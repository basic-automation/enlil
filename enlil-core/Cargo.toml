[package]
name = "enlil-core"
version = "0.1.0"
edition = "2021"
description = "Enlil hypervisor core — VMM entry, vCPU management, memory partitioning"
license.workspace = true
repository.workspace = true
authors.workspace = true
# Publishing guard. This repo runs an automated nightly routine that reshapes
# these crates; they are tightly-coupled internals of an unfinished hypervisor,
# not yet standalone libraries. Flip to `true` (or delete) per crate only when
# its API is stable enough to maintain on crates.io under semver.
publish = false

[dependencies]
enlil-config = { path = "../enlil-config", version = "0.1.0" }
enlil-devices = { path = "../enlil-devices", version = "0.1.0" }
enlil-platform = { path = "../enlil-platform", version = "0.1.0" }
log = "0.4"
thiserror = "2"
anyhow = "1"

# rust-vmm crates — Linux/KVM only
[target.'cfg(target_os = "linux")'.dependencies]
kvm-ioctls = "0.19"
kvm-bindings = { version = "0.10", features = ["fam-wrappers"] }
vm-memory = { version = "0.16", features = ["backend-mmap"] }
vm-superio = "0.8"
linux-loader = { version = "0.13", features = ["bzimage", "elf"] }
vm-allocator = "0.1"
event-manager = "0.4"
vmm-sys-util = "0.12"
libc = "0.2"
