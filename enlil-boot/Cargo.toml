[package]
name = "enlil-boot"
version = "0.1.0"
edition = "2024"
description = "UEFI boot payload — bare-metal target (Phase 6)"

[dependencies]
log = "0.4"
# The authoritative ISA seam (LOCKED PRINCIPLE 2): SVM/VMX capability + VMCB
# decode/programming layer and the page-aligned VMX/SVM region types. enlil-hal
# is no_std + alloc and builds for x86_64-unknown-uefi / x86_64-unknown-enlil,
# so the boot kernel links it directly rather than re-deriving ISA constants.
enlil-hal = { path = "../enlil-hal" }

# The uefi-rs runtime is only pulled in when building for the UEFI firmware
# target. On the Linux/Windows dev host the crate still compiles (the entry
# point and firmware code are gated behind cfg(target_os = "uefi")), so the
# workspace `cargo build/test/clippy` stays green without a UEFI toolchain.
# NOT uefi-rs's "global_allocator" feature: enlil-boot registers its own
# switching allocator (src/allocator.rs) that serves from the firmware pool
# while boot services are up and from the kernel's own linked-list heap after
# ExitBootServices — the uefi-rs one dies with boot services.
[target.'cfg(target_os = "uefi")'.dependencies]
uefi = { version = "0.33", default-features = false, features = [
    "logger",
    "panic_handler",
] }
# The same audited intrusive-free-list heap enlil-platform's bare-metal
# GlobalAlloc uses (memory::init_baremetal_heap); the boot binary carries its
# own instance until Phase 1.2 lets it link enlil-platform directly.
linked_list_allocator = "0.10"
# Phase 1.2 payoff: enlil-platform is now no_std under platform-baremetal, so
# the boot kernel links its host-agnostic primitives (the work-stealing
# scheduler, memory map/paging builders, calibrated-TSC time) directly instead
# of re-deriving them. Gated to the uefi target so the host `cargo build
# --workspace` (where enlil-core pulls enlil-platform with platform-linux) never
# unifies the two mutually-exclusive backend features into one build.
enlil-platform = { path = "../enlil-platform", default-features = false, features = [
    "platform-baremetal",
] }
