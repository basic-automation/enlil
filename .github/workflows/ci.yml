name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Reference validators: the ACPI (iasl) and SMBIOS (dmidecode) integration
      # tests self-skip when these binaries are absent. Installing them makes
      # those tests hard gates instead of silent skips.
      - run: sudo apt-get update && sudo apt-get install -y acpica-tools dmidecode
      # Install exactly the toolchain rust-toolchain.toml pins (channel,
      # components and targets). `dtolnay/rust-toolchain@nightly` was previously
      # used here, which installs the LATEST nightly and ignores the pin, so CI
      # and local builds could silently diverge on different compilers.
      - run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --workspace -- -D warnings
      - run: cargo test --workspace
      # Developer docs: install the pinned mdbook release binary (last 0.4.x;
      # 0.5 removed/renamed book.toml options, so bumping this is a deliberate,
      # reviewed change — see docs/src/docs-ci.md) and gate the book build.
      - name: Install pinned mdbook
        run: |
          MDBOOK_VERSION=0.4.52
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.cargo/bin" mdbook
          mdbook --version
      - name: Build developer docs
        run: mdbook build docs
