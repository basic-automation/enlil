[package]
name = "enlil-devices"
version = "0.1.0"
edition = "2024"
description = "Virtual device backends — USB router, GPU arbiter, storage, network"

[dependencies]
log = "0.4"
anyhow = "1"
thiserror = "2"

[target.'cfg(target_os = "linux")'.dependencies]
vm-memory = { version = "0.16", features = ["backend-mmap"] }
vm-device = "0.1"
vm-superio = "0.8"
vmm-sys-util = "0.12"
