[package]
name = "enlil-devices"
version = "0.1.0"
edition = "2024"
description = "Virtual device backends — USB router, GPU arbiter, storage, network"

[dependencies]
enlil-core = { path = "../enlil-core" }
log = "0.4"
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["fs", "io-util", "sync", "rt"] }
byteorder = "1"
bitflags = "2"
serde = { workspace = true, features = ["derive"] }
serde_json = { version = "1.0.149", features = ["std"] }

[dev-dependencies]
tokio = { version = "1", features = ["fs", "io-util", "sync", "rt", "macros"] }
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
vm-memory = { version = "0.16", features = ["backend-mmap"] }
vm-device = "0.1"
vm-superio = "0.8"
vmm-sys-util = "0.12"
libc = "0.2"
