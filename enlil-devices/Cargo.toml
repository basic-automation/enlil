[package]
name = "enlil-devices"
version = "0.1.0"
edition = "2024"
description = "Virtual device backends — USB router, GPU arbiter, storage, network"
license.workspace = true
repository.workspace = true
authors.workspace = true
# Publishing guard. This repo runs an automated nightly routine that reshapes
# these crates; they are tightly-coupled internals of an unfinished hypervisor,
# not yet standalone libraries. Flip to `true` (or delete) per crate only when
# its API is stable enough to maintain on crates.io under semver.
publish = false

[dependencies]
log = "0.4"
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["fs", "io-util", "sync", "rt"] }
byteorder = "1"
bitflags = "2"
serde = { workspace = true, features = ["derive"] }
serde_json = { version = "1.0.149", features = ["std"] }

[dev-dependencies]
tokio = { version = "1", features = ["fs", "io-util", "sync", "rt", "macros"] }
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
vm-memory = { version = "0.16", features = ["backend-mmap"] }
vm-device = "0.1"
vm-superio = "0.8"
vmm-sys-util = "0.12"
libc = "0.2"
# `vendored` builds libusb from source so runners without the system
# library (and CI) still compile the physical-device forwarder.
rusb = { version = "0.9", features = ["vendored"] }
