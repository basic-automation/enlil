[package]
name = "enlil-std"
version = "0.1.0"
edition = "2024"
description = "Enlil standard library compatibility layer — std-like APIs backed by enlil-platform"
license.workspace = true
repository.workspace = true
authors.workspace = true
# Publishing guard. This repo runs an automated nightly routine that reshapes
# these crates; they are tightly-coupled internals of an unfinished hypervisor,
# not yet standalone libraries. Flip to `true` (or delete) per crate only when
# its API is stable enough to maintain on crates.io under semver.
publish = false

[features]
default = ["platform-linux"]
platform-linux = ["enlil-platform/platform-linux"]
# The bare-metal backend is `no_std` + `alloc`: `HashMap`/`HashSet` come from
# hashbrown (no_std-compatible) instead of `std::collections`.
platform-baremetal = ["enlil-platform/platform-baremetal", "dep:hashbrown"]

[[bin]]
name = "milestone_1_11"
path = "src/bin/milestone_1_11.rs"

[dependencies]
enlil-platform = { path = "../enlil-platform", version = "0.1.0", default-features = false }
# Lazy global bare-metal task scheduler for `thread::spawn` (no_std has no
# `std::sync::OnceLock`).
spin = "0.9"
# no_std HashMap/HashSet for the bare-metal backend.
hashbrown = { version = "0.15", default-features = false, features = [
    "default-hasher",
], optional = true }

